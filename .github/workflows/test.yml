# 工作流的名字，显示在 GitHub 仓库的 Actions 页面
name: API Tests

# on：什么时候触发这个机器人干活
on:
  push:                 # 往仓库推送代码时
    branches: [main]    # 只在 main 分支推送时触发
  pull_request:         # 有人提 PR（合并请求）时也跑一遍
  workflow_dispatch:    # 允许你在网页上手动点按钮触发

# jobs：要干的活，可以有多份，这里只有一份叫 test
jobs:
  test:
    # 用哪种机器跑：GitHub 提供的免费 Linux 云主机
    runs-on: ubuntu-latest

    # steps：步骤，从上往下依次执行，任何一步失败就停
    steps:
      # 第 1 步：把仓库代码拉到这台云主机上
      - name: 拉取代码
        uses: actions/checkout@v4

      # 第 2 步：安装指定版本的 Python
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 第 3 步：装项目依赖（就是 requirements.txt 里的那三个库）
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 第 4 步：跑测试。退出码非 0（有失败）→ 这一步标红 → 整个工作流失败
      - name: 运行测试
        run: pytest -v
